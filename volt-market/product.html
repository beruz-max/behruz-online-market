<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — VOLT MARKET</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    .product-detail { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; padding: 2rem 0; }
    .product-gallery { position: sticky; top: 140px; height: fit-content; }
    .main-image { aspect-ratio: 1; background: var(--bg-secondary); border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--border-color); }
    .main-image img { width: 100%; height: 100%; object-fit: cover; }
    .thumb-row { display: flex; gap: 0.75rem; margin-top: 1rem; }
    .thumb { width: 72px; height: 72px; border-radius: var(--radius-md); overflow: hidden; border: 2px solid var(--border-color); cursor: pointer; opacity: 0.6; transition: all 0.2s; }
    .thumb.active, .thumb:hover { border-color: var(--accent-primary); opacity: 1; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .product-info h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; }
    .product-meta { display: flex; gap: 1.5rem; margin: 1rem 0; font-size: 0.9rem; color: var(--text-secondary); }
    .price-block { margin: 1.5rem 0; }
    .price-block .current { font-size: 2rem; font-weight: 800; color: var(--accent-secondary); }
    .price-block .old { font-size: 1.2rem; color: var(--text-muted); text-decoration: line-through; margin-left: 0.75rem; }
    .price-block .disc { background: var(--error); color: white; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.85rem; font-weight: 700; margin-left: 0.75rem; }
    .qty-selector { display: flex; align-items: center; gap: 0; border: 1px solid var(--border-color); border-radius: var(--radius-md); width: fit-content; }
    .qty-selector button { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-secondary); }
    .qty-selector button:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .qty-selector span { width: 48px; text-align: center; font-weight: 600; }
    .action-row { display: flex; gap: 1rem; margin: 1.5rem 0; flex-wrap: wrap; }
    .specs-table { width: 100%; margin-top: 1rem; }
    .specs-table tr { border-bottom: 1px solid var(--border-color); }
    .specs-table td { padding: 0.75rem 0; font-size: 0.9rem; }
    .specs-table td:first-child { color: var(--text-muted); width: 40%; }
    .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border-color); margin-bottom: 1.5rem; }
    .tab { padding: 0.75rem 1.5rem; font-weight: 500; color: var(--text-secondary); cursor: pointer; border-bottom: 2px solid transparent; }
    .tab.active { color: var(--accent-secondary); border-bottom-color: var(--accent-primary); }
    @media (max-width: 768px) { .product-detail { grid-template-columns: 1fr; } .product-gallery { position: static; } }
  </style>
</head>
<body>
  <div id="site-header"></div>
  <div class="container" id="productContent">
    <div class="loader"><div class="spinner"></div></div>
  </div>
  <div id="site-footer"></div>
  <script src="js/data-service.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/core.js"></script>
  <script>
    let qty = 1;
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const id = UI.getUrlParam('id');
        const product = ProductHelper.getById(id);
        if (!product) {
          document.getElementById('productContent').innerHTML = '<div class="empty-state"><div class="empty-state-icon">😕</div><h3>Product not found</h3><a href="catalog.html" class="btn btn-primary" style="margin-top:1rem">Browse Catalog</a></div>';
          return;
        }
        document.title = product.name + ' — VOLT MARKET';
        const stars = ProductHelper.renderStars(product.rating);
        const images = [product.mainImage, ...(product.gallery || [])];

        document.getElementById('productContent').innerHTML = `
          <div class="product-detail">
            <div class="product-gallery">
              <div class="main-image"><img id="mainImg" src="${product.mainImage}" alt="${product.name}" onerror="this.src='assets/images/product-placeholder.svg'"></div>
              <div class="thumb-row">
                ${images.map((img, i) => `<div class="thumb ${i===0?'active':''}" onclick="document.getElementById('mainImg').src='${img}';document.querySelectorAll('.thumb').forEach(t=>t.classList.remove('active'));this.classList.add('active')"><img src="${img}" onerror="this.parentElement.style.display='none'"></div>`).join('')}
              </div>
            </div>
            <div class="product-info">
              <div style="font-size:0.85rem;color:var(--text-muted);margin-bottom:0.5rem"><a href="catalog.html" style="color:var(--text-muted)">Catalog</a> / <a href="catalog.html?cat=${product.categoryName.toLowerCase().replace(/ /g,'-')}" style="color:var(--text-muted)">${product.categoryName}</a></div>
              <h1>${product.name}</h1>
              <div class="product-meta">
                <span>Brand: <strong style="color:var(--text-primary)">${product.brandName}</strong></span>
                <span>SKU: ${product.sku}</span>
                <span class="stars">${stars} (${product.reviewCount} reviews)</span>
              </div>
              <div class="price-block">
                <span class="current">${DataService.formatPrice(product.price)}</span>
                ${product.oldPrice ? `<span class="old">${DataService.formatPrice(product.oldPrice)}</span><span class="disc">-${product.discount}%</span>` : ''}
              </div>
              <p style="color:var(--text-secondary);line-height:1.7;margin-bottom:1.5rem">${product.description}</p>
              <div style="margin-bottom:1rem">
                <span style="font-size:0.9rem;color:var(--text-secondary)">Availability: </span>
                ${product.stock > 0 ? `<span style="color:var(--success);font-weight:600">${product.stock} in stock</span>` : `<span style="color:var(--error);font-weight:600">Out of stock</span>`}
              </div>
              ${product.colors && product.colors.length ? `<div style="margin-bottom:1rem"><span style="font-size:0.9rem;color:var(--text-secondary)">Colors: </span>${product.colors.map(c => `<span class="badge badge-primary" style="margin:2px">${c}</span>`).join('')}</div>` : ''}
              <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1rem">
                <span style="font-size:0.9rem;color:var(--text-secondary)">Quantity:</span>
                <div class="qty-selector">
                  <button onclick="qty=Math.max(1,qty-1);document.getElementById('qtyVal').textContent=qty">−</button>
                  <span id="qtyVal">1</span>
                  <button onclick="qty=Math.min(${product.stock},qty+1);document.getElementById('qtyVal').textContent=qty">+</button>
                </div>
              </div>
              <div class="action-row">
                <button class="btn btn-primary btn-lg" onclick="Cart.add('${product.id}', qty)" ${product.stock < 1 ? 'disabled' : ''}>🛒 Add to Cart</button>
                <button class="btn btn-secondary" onclick="Wishlist.toggle('${product.id}')">♡ Wishlist</button>
                <button class="btn btn-ghost" onclick="Compare.toggle('${product.id}')">⇄ Compare</button>
              </div>
              <div style="margin-top:1.5rem;padding:1rem;background:var(--bg-secondary);border-radius:var(--radius-md);font-size:0.9rem;color:var(--text-secondary)">
                🛡️ ${product.warranty || '1 Year Warranty'} &nbsp;|&nbsp; 🚚 ${window.I18n?.t('Free delivery over') || 'Free delivery over'} ${DataService.formatPrice((DataService.get(VOLT_STORAGE_KEYS.settings) || {}).freeDeliveryMin ?? 1280000)} &nbsp;|&nbsp; ↩️ ${window.I18n?.t('30-day returns') || '30-day returns'}
              </div>
            </div>
          </div>
          <div style="margin:3rem 0">
            <div class="tabs">
              <div class="tab active" onclick="showTab('specs',this)">Specifications</div>
              <div class="tab" onclick="showTab('reviews',this)">Reviews (${product.reviewCount})</div>
            </div>
            <div id="tab-specs">
              <table class="specs-table">
                ${Object.entries(product.specifications || {}).map(([k,v]) => `<tr><td>${k.charAt(0).toUpperCase()+k.slice(1)}</td><td><strong>${v}</strong></td></tr>`).join('') || '<tr><td colspan="2">No specifications available</td></tr>'}
              </table>
            </div>
            <div id="tab-reviews" style="display:none">
              <div id="reviewsList"></div>
            </div>
          </div>
          <div style="margin:3rem 0">
            <h2 class="section-title">Related Products</h2>
            <div class="product-grid" id="relatedProducts"></div>
          </div>
        `;

        // Related
        const related = ProductHelper.getByCategory(product.categoryId)
          .filter(p => p.id !== product.id)
          .sort((a, b) => Number(b.brandId === product.brandId) - Number(a.brandId === product.brandId) || Math.abs(a.price - product.price) - Math.abs(b.price - product.price))
          .slice(0, 4);
        document.getElementById('relatedProducts').innerHTML = related.map(p => ProductHelper.renderCard(p)).join('');

        // Reviews
        const reviews = (DataService.get(VOLT_STORAGE_KEYS.reviews) || []).filter(r => r.productId === product.id && r.status === 'approved').slice(0, 10);
        document.getElementById('reviewsList').innerHTML = reviews.length
          ? reviews.map(r => `<div style="padding:1rem 0;border-bottom:1px solid var(--border-color)"><div style="display:flex;justify-content:space-between"><strong>${r.userName}</strong><span class="stars">${'★'.repeat(r.rating)}</span></div><p style="color:var(--text-secondary);margin-top:0.5rem;font-size:0.9rem">${r.comment}</p><span style="font-size:0.8rem;color:var(--text-muted)">${DataService.formatDate(r.createdAt)}</span></div>`).join('')
          : '<p style="color:var(--text-muted)">No reviews yet</p>';
      }, 150);
    });

    function showTab(name, el) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('tab-specs').style.display = name === 'specs' ? 'block' : 'none';
      document.getElementById('tab-reviews').style.display = name === 'reviews' ? 'block' : 'none';
    }
  </script>
</body>
</html>

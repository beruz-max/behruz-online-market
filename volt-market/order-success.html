<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Success — VOLT MARKET</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="site-header"></div>
  <div class="container" style="text-align:center;padding:4rem 1.5rem">
    <div style="font-size:4rem;margin-bottom:1rem">✅</div>
    <h1 style="font-size:2rem;font-weight:700;margin-bottom:0.5rem">Order Placed Successfully!</h1>
    <p style="color:var(--text-secondary);margin-bottom:0.5rem">Thank you for your purchase</p>
    <p style="font-size:1.1rem;margin-bottom:2rem">Order ID: <strong id="orderId" style="color:var(--accent-secondary)"></strong></p>
    <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap">
      <a href="catalog.html" class="btn btn-primary">Continue Shopping</a>
      <a href="index.html" class="btn btn-secondary">Back to Store</a>
    </div>
  </div>
  <div id="site-footer"></div>
  <script src="js/data-service.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/core.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const id = new URLSearchParams(window.location.search).get('id');
      document.getElementById('orderId').textContent = id || 'N/A';
    });
  </script>
</body>
</html>
